<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pagina non trovata · Che Succede Belluno</title>
<link rel="icon" href="/favicon.png"><meta name="theme-color" content="#12233F"><link rel="stylesheet" href="/style.css">
<script>
// Link di un evento la cui pagina non c'è (evento passato da tempo o appena pubblicato):
// si passa alla pagina generale, che legge l'evento dal database.
(function () {
  var m = location.pathname.match(/^\/e\/([A-Za-z0-9_-]{1,64})(?:\.html)?\/?$/);
  if (m) location.replace('/e/?id=' + m[1]);
  var g = location.pathname.match(/^\/g\/([A-Za-z0-9_-]{1,64})\/?$/);
  if (g) location.replace('/g/?id=' + g[1]);
})();
</script></head><body><div class="wrap">
<header><img src="/icon.svg" alt=""><b>CHE SUCCEDE <span>BELLUNO</span></b></header>
<div class="card">
<h1>Pagina non trovata</h1>
<p class="meta">Il link potrebbe essere incompleto.</p>
<a class="btn primary" href="/">Vedi gli eventi in provincia</a>
</div></div></body></html>
