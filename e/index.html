<script>
const q=new URLSearchParams(location.search);
const set=(id,v,pre)=>{const el=document.getElementById(id); if(v){el.textContent=(pre||'')+v}else{el.remove()}};
const t=q.get('t'); if(t){document.getElementById('t').textContent=t; document.title=t+' · Che Succede Belluno';}
set('d',q.get('d'),'📅 '); set('p',q.get('p'),'📍 ');
const id=q.get('id')||'';
const store='https://play.google.com/store/apps/details?id=it.chesuccedebelluno.app';
const target='bortovalabs.github.io/e/?id='+encodeURIComponent(id);
document.getElementById('open').href=/Android/i.test(navigator.userAgent)
  ? 'intent://'+target+'#Intent;scheme=https;package=it.chesuccedebelluno.app;S.browser_fallback_url='+encodeURIComponent(store)+';end'
  : store;
</script></body></html>
