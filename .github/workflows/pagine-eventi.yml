# Ogni ora crea una pagina per ogni evento in arrivo (/e/<codice>), con titolo, data, luogo e foto
# già scritti dentro: così l'anteprima su WhatsApp, Telegram e Facebook mostra l'evento vero.
# Legge solo dati pubblici del database. Si può anche avviare a mano: Actions > Pagine eventi > Run workflow.
name: Pagine eventi

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pagine-eventi
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Crea le pagine
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: python3 tools/pagine_eventi.py

      - name: Salva le modifiche
        run: |
          git config user.name "Pagine eventi"
          git config user.email "actions@users.noreply.github.com"
          git add -A e
          if git diff --cached --quiet; then
            echo "Nessun cambiamento."
          else
            git commit -m "Pagine eventi aggiornate"
            git push
          fi
